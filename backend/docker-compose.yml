# =====================================================================================
# PROJECT NEXUS — LOCAL DEVELOPMENT (PostgreSQL + App)
#
# Dùng:  cp .env.example .env   (điền giá trị)   rồi   docker compose up --build
#
# BẢO MẬT:
#   - Secret lấy từ biến môi trường / file .env (KHÔNG commit, KHÔNG bake vào image).
#   - db/*.sql được nạp CHỈ KHI volume postgres còn trống (lần khởi tạo đầu);
#     mọi script đều dùng IF NOT EXISTS / ON CONFLICT DO NOTHING nên KHÔNG phá dữ liệu cũ.
# =====================================================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nexus}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nexus_pgdata:/var/lib/postgresql/data
      # Khởi tạo schema/bảng/seed (00..99) chỉ khi volume trống — idempotent, không phá dữ liệu.
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-nexus}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-nexus}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      # dev: update (Hibernate đồng bộ schema) | DB chung/demo: validate
      DDL_AUTO: ${DDL_AUTO:-update}
      JWT_SECRET: ${JWT_SECRET:-nexus-dev-secret-doi-truoc-khi-nop}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      SERVER_PORT: "8080"
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  nexus_pgdata:
