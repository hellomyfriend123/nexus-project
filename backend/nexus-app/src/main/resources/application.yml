# =====================================================================================
# PROJECT NEXUS — cấu hình ứng dụng
#
# Thông tin kết nối DB lấy từ biến môi trường (KHÔNG hard-code, KHÔNG commit mật khẩu).
#   DB_URL      : jdbc:postgresql://<host>:<port>/<database>
#   DB_USERNAME : user
#   DB_PASSWORD : password
#   DDL_AUTO    : update (dev) | validate (môi trường dùng chung / demo)
#   JWT_SECRET  : chuỗi ký token — PHẢI đổi khi deploy
# Xem file .env.example ở thư mục gốc.
# =====================================================================================
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: nexus
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nexus}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 10000
      pool-name: nexus-pool

  jpa:
    # dev: update | môi trường chung (Supabase): validate — DDL tạo bằng db/*.sql
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        # dev tiện lợi: tự tạo schema nexus_user, nexus_catalog, ... nếu chưa có
        hbm2ddl:
          create_namespaces: true

  jackson:
    default-property-inclusion: non_null

  # Tắt banner cho log gọn khi demo
  main:
    banner-mode: ${BANNER_MODE:console}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  api-docs:
    path: /v3/api-docs

nexus:
  security:
    token:
      secret: ${JWT_SECRET:nexus-dev-secret-doi-truoc-khi-nop}
      ttl-minutes: ${TOKEN_TTL_MINUTES:480}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    # ---------------------------------------------------------------------------------
    # Đăng nhập bằng Google (OAuth 2.0 / OpenID Connect)
    #
    # KHÔNG dùng khối spring.security.oauth2.client của Spring Boot vì khối đó tạo
    # ClientRegistration ngay khi khởi động: nếu client-id rỗng thì ứng dụng NÉM LỖI
    # ("clientId cannot be empty") và không chạy được — kể cả khi chỉ muốn mở Swagger.
    # Cấu hình dưới đây được đọc bởi GoogleOAuth2Config (nexus-common), lớp này chỉ bật
    # bean OAuth2 khi CẢ client-id và client-secret đều có giá trị.
    #
    # Bỏ trống = tắt Google login, mọi API khác vẫn hoạt động bình thường.
    # ---------------------------------------------------------------------------------
    oauth2:
      google:
        client-id: ${GOOGLE_CLIENT_ID:}
        client-secret: ${GOOGLE_CLIENT_SECRET:}
      # Nơi backend chuyển hướng trình duyệt về sau khi Google xác thực xong.
      # Phải là một route của frontend (mặc định: http://localhost:5173/oauth2/callback).
      frontend-callback-url: ${OAUTH2_FRONTEND_CALLBACK_URL:http://localhost:5173/oauth2/callback}
      # Vai trò gán cho tài khoản tạo mới từ Google khi client không gửi ?role=
      default-role: ${OAUTH2_DEFAULT_ROLE:BUYER}
  auction:
    # FR-33/FR-34: chu kỳ job tự chuyển SCHEDULED -> ACTIVE -> ENDED (mili giây)
    scheduler-interval-ms: ${AUCTION_SCHEDULER_INTERVAL_MS:15000}
  supabase:
    url: ${SUPABASE_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    storage-bucket: ${SUPABASE_STORAGE_BUCKET:product-images}
  storage:
    max-file-size-mb: 5
    allowed-types: image/jpeg,image/png,image/webp,image/gif

logging:
  level:
    root: INFO
    com.nexus: ${LOG_LEVEL:DEBUG}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:INFO}
    org.springframework.security: INFO
