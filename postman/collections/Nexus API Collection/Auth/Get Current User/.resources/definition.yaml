description: |-
  StartFragment

  ### ME API – Current User Information Testing

  **Mục đích:**  
  Kiểm thử chức năng lấy thông tin người dùng hiện tại (Get Current User) của hệ thống Nexus thông qua JWT Access Token.

  **Endpoint:**

  - Method: `GET`
      
  - URL: `/api/v1/auth/me`
      

  **Authentication:**

  - Required: Bearer Token (JWT).
      
  - Header: `Authorization: Bearer {{accessToken}}`.
      

  **Phạm vi kiểm thử:**

  - Lấy thông tin người dùng khi JWT hợp lệ.
      
  - Kiểm tra trường hợp không cung cấp Access Token.
      
  - Kiểm tra trường hợp JWT không hợp lệ.
      
  - Kiểm tra trường hợp JWT đã hết hạn.
      
  - Kiểm tra tính chính xác của User ID, Email, Username, Full Name, Roles và Status.
      
  - Đảm bảo người dùng chỉ nhận được thông tin của tài khoản tương ứng với JWT đang sử dụng.
      

  **Danh sách Test Cases đề xuất:**

  - `ME-01`: Lấy thông tin User thành công – Expected: `200 OK`.
      
  - `ME-02`: Không cung cấp JWT – Expected: `401 Unauthorized`.
      
  - `ME-03`: JWT không hợp lệ – Expected: `401 Unauthorized`.
      
  - `ME-04`: JWT hết hạn – Expected: `401 Unauthorized`.
      

  **Preconditions:**

  - Backend Nexus đang hoạt động.
      
  - Có tài khoản đã đăng ký và đăng nhập thành công.
      
  - Environment đã lưu biến `accessToken`.
      
  - Các request phải sử dụng Bearer Token hợp lệ, ngoại trừ những test case kiểm tra lỗi xác thực.
      

  **Expected Result:**  
  API trả về đúng thông tin người dùng hiện tại dựa trên User ID được xác định từ JWT. Response không được chứa password hoặc password hash.

  **Expected Response Fields:**

  - `userId`: UUID của người dùng.
      
  - `email`: Email tài khoản.
      
  - `username`: Username.
      
  - `fullName`: Họ và tên.
      
  - `roles`: Danh sách quyền của người dùng.
      
  - `status`: Trạng thái tài khoản.
      

  **Note:** User ID được lấy từ JWT Subject thông qua SecurityUtils, không nhận từ Request Body hoặc Query Parameter.

  EndFragment
